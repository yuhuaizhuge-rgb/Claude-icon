name: CrabApp
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  CrabApp:
    type: application
    platform: iOS
    sources:
      - path: CrabApp
      - path: Shared/CrabAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuhuaizhuge.claudeicon
        PRODUCT_NAME: CrabApp
    info:
      path: CrabApp/Info.plist
      properties:
        CFBundleDisplayName: 小螃蟹
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
    dependencies:
      - target: CrabWidget
        embed: true
        codeSign: true
        copy:
          destination: plugins
  CrabWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CrabWidget
      - path: Shared/CrabAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuhuaizhuge.claudeicon.widget
        PRODUCT_NAME: CrabWidget
        SKIP_INSTALL: YES
    info:
      path: CrabWidget/Info.plist
      properties:
        CFBundleDisplayName: 小螃蟹实时活动
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - XF0100.ttf
          - XF0101.ttf
          - XF0102.ttf
          - XF0103.ttf
          - XF0104.ttf
          - XF0105.ttf
          - XF0106.ttf
          - XF0107.ttf
          - XF0108.ttf
          - XF0109.ttf
          - XF0110.ttf
          - XF0111.ttf
          - XF0112.ttf
          - XF0113.ttf
          - XF0114.ttf
          - XF0115.ttf
          - XF0116.ttf
          - XF0117.ttf
          - XF0118.ttf
